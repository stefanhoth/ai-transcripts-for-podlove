services:
  db:
    image: mysql:latest
    container_name: ai-transcripts-for-podlove-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    expose:
      - 3306
    networks:
      - app-network
    healthcheck:
      test: mysqladmin ping -h localhost -u wordpress -pwordpress
      interval: 5s
      retries: 10

  wordpress:
    build: .
    container_name: ai-transcripts-for-podlove-wp
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_LOCALE: de_DE
    volumes:
      - wp-data:/var/www/html
      # Mount this plugin (live-reloads on file changes)
      - .:/var/www/html/wp-content/plugins/ai-transcripts-for-podlove
    networks:
      - app-network


volumes:
  wp-data:

networks:
  app-network:
    driver: bridge
